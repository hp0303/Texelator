name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_repository.py
      - run: pytest -q
      - run: ruff check texelator tests

  windows-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_repository.py
      - run: pytest -q
      - run: ruff check texelator tests
      - name: Parse the native Windows installer
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\setup.ps1), [ref]$null, [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; exit 1 }
