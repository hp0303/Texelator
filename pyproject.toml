[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texelator"
version = "0.3.0.dev1"
description = "Texture-backed low-bit inference runtime for local Hugging Face language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hyun Park"}]
keywords = ["CUDA", "BC4", "LLM", "quantization", "texture", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "transformers>=4.48,<6",
  "accelerate>=1.0,<2",
  "datasets>=3,<6",
  "huggingface-hub>=0.28,<2",
  "jinja2>=3.1.0,<4",
  "numpy>=1.26,<3",
  "ninja>=1.11",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
paper = ["matplotlib>=3.8", "scienceplots>=2.1"]

[project.scripts]
texelator = "texelator.cli:main"

[tool.setuptools.packages.find]
include = ["texelator*"]

[tool.setuptools.package-data]
texelator = ["cuda/*.cu", "cuda/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
